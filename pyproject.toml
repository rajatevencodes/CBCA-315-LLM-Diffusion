[project]
name = "cbca315-semantic-diffusion"
version = "1.0.0"
description = "Budgeted LLM refinement of edge weights for community detection in citation networks"
requires-python = ">=3.13,<3.14"
dependencies = [
    "igraph>=0.11,<2",
    "matplotlib>=3.9,<4",
    "networkx>=3.4,<4",
    "numpy>=2,<3",
    "pandas>=2.2,<4",
    "python-dotenv>=1,<2",
    "requests>=2.32,<3",
    "scikit-learn>=1.5,<2",
    "scipy>=1.14,<2",
    "sentence-transformers>=3,<6",
    "tabulate>=0.9,<1",
    "torch>=2.6,<3",
]

[tool.uv]
package = false

# CPU-only PyTorch on Linux/Windows (avoids multi-GB GPU downloads). macOS uses the normal build.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
